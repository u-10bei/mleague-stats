name: konoui DB 更新

# konoui/m-league-game-db の新しいリリースを取り込み、同梱している軽量DB を
# 作り直して PR を出す。マージすると Community Cloud が自動で再デプロイされる。
#
# 配布DB は 562MB あるためリポジトリには入れず、ここで毎回ダウンロードして
# アプリが使う 11 テーブルだけを抜き出す (5MB 程度)。

on:
  schedule:
    # 毎週月曜 09:00 JST (= 00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'リリースが同じでも作り直す'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 最新リリースを確認
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo konoui/m-league-game-db --json tagName -q .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          current=$(cat data/konoui_release.txt 2>/dev/null || echo "")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "konoui 最新: $tag / 取り込み済み: ${current:-なし}"
          if [ "$tag" = "$current" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 配布DB を取得
        if: steps.release.outputs.skip == 'false'
        run: |
          curl -fL -o database.zip \
            https://github.com/konoui/m-league-game-db/releases/latest/download/database.zip
          unzip -q database.zip -d data/
          rm database.zip
          ls -lh data/database.sqlite3

      - name: 軽量DB を生成
        if: steps.release.outputs.skip == 'false'
        run: |
          pip install -r requirements.txt
          python build_slim_db.py
          echo "${{ steps.release.outputs.tag }}" > data/konoui_release.txt

      - name: 検証
        if: steps.release.outputs.skip == 'false'
        env:
          # 生成した軽量DB だけで成立することを確かめる
          KONOUI_DB_PATH: data/mleague_konoui_slim.sqlite3
        run: |
          python db_konoui.py
          python validate_games.py

      - name: 差分があれば PR を作成
        if: steps.release.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # 配布DB は .gitignore 済みなのでコミット対象に入らない
          if git diff --quiet -- data/mleague_konoui_slim.sqlite3 data/konoui_release.txt; then
            echo "軽量DB に差分なし"
            exit 0
          fi

          branch="chore/konoui-db-${TAG}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/mleague_konoui_slim.sqlite3 data/konoui_release.txt
          git commit -m "chore: konoui DB を ${TAG} に更新

          konoui/m-league-game-db の配布DB から、アプリが使う 11 テーブルだけを
          抜き出した軽量DB を作り直した。"
          git push -u origin "$branch"

          coverage=$(python - <<'PY'
          import sqlite3
          con = sqlite3.connect("file:data/mleague_konoui_slim.sqlite3?mode=ro", uri=True)
          lo, hi, n = con.execute("SELECT MIN(date), MAX(date), COUNT(*) FROM game").fetchone()
          print(f"{lo} 〜 {hi} / 全{n:,}試合")
          PY
          )

          gh pr create \
            --title "chore: konoui DB を ${TAG} に更新" \
            --body "konoui/m-league-game-db の新しいリリース \`${TAG}\` を取り込みました。

          カバー範囲: ${coverage}

          配布DB (562MB) からアプリが参照する 11 テーブルだけを抜き出した軽量DB を
          作り直しています。CI で全試合の整合性検証を通しています。

          マージすると Streamlit Community Cloud が自動で再デプロイされます。"
